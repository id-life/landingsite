# Dependency updates (ENG-13). Security updates are opened immediately; version updates weekly, grouped,
# with a cooldown so a freshly published release is not adopted on day one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
      semver-major-days: 14
    groups:
      next-react:
        patterns: ['next', 'react', 'react-dom', 'eslint-config-next', '@next/*']
      three-r3f:
        patterns: ['three', '@react-three/*', 'postprocessing', 'three-*']
      sentry:
        patterns: ['@sentry/*']
      minor-and-patch:
        update-types: ['minor', 'patch']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
