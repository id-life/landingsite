# PERF-08: weekly CrUX snapshot committed to perf/crux/ (records "insufficient data" explicitly). Needs the
# CRUX_API_KEY repository secret; without it the job is skipped.
name: crux-weekly
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.CRUX_API_KEY != ''
      - uses: actions/setup-node@v4
        if: env.CRUX_API_KEY != ''
        with:
          node-version: 24
      - if: env.CRUX_API_KEY != ''
        run: node scripts/crux-weekly.mjs
      - if: env.CRUX_API_KEY != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add perf/crux
          git diff --cached --quiet || git commit -m "chore(crux): weekly CrUX snapshot" && git push
