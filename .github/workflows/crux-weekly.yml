# PERF-08: weekly CrUX snapshot committed to perf/crux/ (records "insufficient data" explicitly). Needs the
# CRUX_API_KEY repository secret; without it the job is skipped.
name: crux-weekly
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crux:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
    steps:
      # Credentials stay on the checkout: the job pushes its snapshot commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CRUX_API_KEY != ''
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.CRUX_API_KEY != ''
        with:
          node-version-file: .nvmrc
      - if: env.CRUX_API_KEY != ''
        run: node scripts/crux-weekly.mjs
      - if: env.CRUX_API_KEY != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add perf/crux
          git diff --cached --quiet || git commit -m "chore(crux): weekly CrUX snapshot" && git push
