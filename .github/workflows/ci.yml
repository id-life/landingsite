# Quality gates (ENG-01, PERF-09). Every job is a separate status check, so each can be made required on main.
# Standard GitHub-hosted runners are free for public repositories. No secrets are used: pull requests from forks
# run the same checks with the read-only token.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      # Warnings may only go down: any rule above its count in eslint-warnings.json fails.
      - run: npm run lint:ratchet
      # Unused files and dependencies fail; unused exports are reported as warnings (knip.jsonc).
      - run: npm run knip

  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Production dependencies only; fails on a high or critical advisory.
      - run: npm audit --omit=dev --audit-level=high

  build:
    name: build, bundle and first-visit budget
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # A local build (webpack, like Vercel's `npm run build`): analytics and Sentry are compiled out (DEPLOY_ENV is
      # not production).
      - run: npm run build
      # Tests that read the built pages (skipped in the test job, which has no build): SEO-08 A2's host clause on the
      # structured data, and the hidden layer held against the owner's recorded copy.
      - run: npx vitest run test/jsonld-hosts.test.mjs test/hidden-layer.test.mjs
      # Bundle check (initial JS per route, gzipped) and first-visit weight per device against perf-budget.json. Chrome ships on the
      # runner image; the runner has no GPU, so WebGL runs on SwiftShader, and the check fails if the experience
      # gets no WebGL context (the no-WebGL path would pass for the wrong reason).
      - run: npm run perf:budget -- --out perf-report.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-report
          path: perf-report.json
          if-no-files-found: ignore
