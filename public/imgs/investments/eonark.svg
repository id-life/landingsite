<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="38 17 166 36" width="830" height="180">
  <defs>
    <filter id="contrast" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.1" intercept="-0.05" />
        <feFuncG type="linear" slope="1.1" intercept="-0.05" />
        <feFuncB type="linear" slope="1.1" intercept="-0.05" />
      </feComponentTransfer>
    </filter>
    <mask id="wordmark" maskUnits="userSpaceOnUse" x="0" y="0" width="224" height="60" style="mask-type:luminance">
      <image filter="url(#contrast)" width="224" height="60" xlink:href="data:image/jpeg;base64," />
    </mask>
  </defs>
  <rect x="38" y="17" width="166" height="36" fill="white" mask="url(#wordmark)" />
</svg>
